[project]
name = "qlcplus-mcp"
version = "1.0.0"
description = "MCP server and CLI in front of the QLC+ Agent API (Web Access websocket)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # The high level server we use is MCPServer. In MCP SDK v1 this class was
    # called FastMCP (mcp.server.fastmcp) and v2 refuses to import from there,
    # so the v2 floor is real and not cosmetic.
    "mcp>=2,<3",
    "websockets>=13",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[project.scripts]
qlcplus-mcp = "qlcplus_mcp.server:main"
qlcplus-agent = "qlcplus_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qlcplus_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
